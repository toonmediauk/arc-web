<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARC 360</title>
<style>
  @font-face {
    font-family: 'Cooper Hewitt';
    src: local('Cooper Hewitt'), local('CooperHewitt-Book');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Cooper Hewitt';
    src: local('Cooper Hewitt Bold'), local('CooperHewitt-Bold');
    font-weight: 700;
  }

  :root {
    --header-footer-bg: #262626;
    --body-bg-1: #282828;
    --body-bg-2: #1f1f1e;
    --border-subtle: rgba(255, 255, 255, 0.15);
    --font-main: 'Cooper Hewitt', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-main);
    background: var(--body-bg-1);
    color: #ffffff;
  }

  /* ---------- header ---------- */

  .site-header {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 84px;
    padding: 0 48px;
    background: var(--header-footer-bg);
    border-bottom: 1px solid var(--border-subtle);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }

  .logo svg { width: 32px; height: 32px; display: block; }

  .logo-word {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #ffffff;
  }

  .btn-talk {
    display: inline-flex;
    align-items: center;
    border: 1px solid rgba(255, 255, 255, 0.4);
    color: #ffffff;
    background: transparent;
    padding: 10px 24px;
    border-radius: 8px;
    font-family: var(--font-main);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.2px;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .btn-talk:hover {
    background: #ffffff;
    color: #262626;
  }

  /* ---------- sections ---------- */

  .section {
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 48px;
  }

  .section-dark-1 { background: var(--body-bg-1); color: #ffffff; }
  .section-white { background: #ffffff; color: #1a1a1a; }
  .section-dark-2 { background: var(--body-bg-1); color: #ffffff; }
  .section-darkest { background: var(--body-bg-2); color: #ffffff; }

  .placeholder-label {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.45;
  }

  .section-white .placeholder-label { color: #1a1a1a; }

  /* ---------- footer ---------- */

  .site-footer {
    background: var(--header-footer-bg);
    padding: 28px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.55);
    border-top: 1px solid var(--border-subtle);
  }

  .site-footer a { color: rgba(255, 255, 255, 0.55); text-decoration: none; }
  .site-footer a:hover { color: #ffffff; }
</style>
</head>
